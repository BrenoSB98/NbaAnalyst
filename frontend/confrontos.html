<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confrontos</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/confronto.css" />
  </head>
  <body>
    <div id="app-wrapper">
      <nav id="navbar-principal"></nav>
      <main id="conteudo-principal">
        <div class="cabecalho-confrontos">
          <div class="container">
            <div class="linha-acento mb-2"></div>
            <h1 class="titulo-secao mb-1">Análise de Confronto</h1>
          </div>
        </div>

        <div class="barra-controles">
          <div class="container">
            <div class="row g-3 align-items-end">
              <div class="col-12 col-md-5">
                <label class="form-label-nba">Time Mandante</label>
                <select class="form-control-nba w-100" id="select-time-casa">
                  <option value="">Selecione o time mandante</option>
                </select>
              </div>
              <div class="col-12 col-md-5">
                <label class="form-label-nba">Time Visitante</label>
                <select class="form-control-nba w-100" id="select-time-fora">
                  <option value="">Selecione o time visitante</option>
                </select>
              </div>
              <div class="col-6 col-md-1">
                <label class="form-label-nba">Últimos</label>
                <select class="form-control-nba w-100" id="select-ultimos-n">
                  <option value="5" selected>5</option>
                  <option value="10">10</option>
                  <option value="15">15</option>
                  <option value="20">20</option>
                </select>
              </div>
              <div class="col-6 col-md-1 d-flex">
                <button class="btn-buscar w-100" onclick="buscarConfrontos()">
                  <i class="bi-search me-1"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="area-confronto">
          <div class="container">
            <div id="pagina-inicial">
              <div class="estado-vazio">
                <i class="bi bi-bar-chart-steps icone-vazio"></i>
                <p class="titulo-vazio">Selecione dois times</p>
                <p class="desc-vazio">
                  Escolha o time da casa e o visitante para ver a análise
                  comparativa.
                </p>
              </div>
            </div>

            <div id="pagina-carregando" style="display: none">
              <div class="spinner-nba">
                <div class="bola-animada"></div>
                <span>Analisando confronto...</span>
              </div>
            </div>

            <div id="pagina-erro" style="display: none">
              <div class="estado-vazio">
                <i class="bi bi-exclamation-circle icone-vazio"></i>
                <p class="titulo-vazio" id="msg-erro">Erro ao carregar</p>
                <p class="desc-vazio">
                  Verifique se os times selecionados têm dados disponíveis no
                  banco.
                </p>
              </div>
            </div>

            <div id="pagina-conteudo" style="display: none">
              <div class="row g-3 mb-4">
                <div class="col-12 col-md-6">
                  <div class="card-time" id="card-time-casa"></div>
                </div>
                <div class="col-12 col-md-6">
                  <div class="card-time" id="card-time-fora"></div>
                </div>
              </div>

              <div class="tabela-confronto-wrapper">
                <table class="tabela-confronto">
                  <thead>
                    <tr>
                      <th class="th-valor-casa" id="th-casa">—</th>
                      <th class="th-stat"></th>
                      <th class="th-valor-fora" id="th-fora">—</th>
                    </tr>
                  </thead>
                  <tbody id="tbody-confronto"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </main>
      <footer id="rodape-principal"></footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/componentes.js"></script>
    <script src="js/confrontos.js"></script>
  </body>
</html>
