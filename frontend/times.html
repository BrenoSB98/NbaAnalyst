<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Times</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/times.css" />
  </head>
  <body>
    <div id="app-wrapper">
      <nav id="navbar-principal"></nav>

      <main id="conteudo-principal">
        <div class="cabecalho-times">
          <div class="container">
            <div class="linha-acento mb-2"></div>
            <h1 class="titulo-secao mb-1">Franquias NBA</h1>
            <p class="subtitulo-secao mb-0">
              Selecione um time para ver o perfil completo.
            </p>
          </div>
        </div>

        <div class="barra-busca">
          <div class="container">
            <div class="row g-2 align-items-center">
              <div class="col-12 col-md-6">
                <input
                  type="text"
                  class="form-control-nba"
                  id="campo-busca"
                  placeholder="Buscar time por nome..."
                  oninput="filtrarTimes()"
                />
              </div>
              <div class="col-auto">
                <span class="contador-times mb-0" id="contador-times"></span>
              </div>
            </div>
          </div>
        </div>

        <div class="container" style="padding-top: 32px; padding-bottom: 48px">
          <div id="times-carregando">
            <div class="spinner-nba">
              <div class="bola-animada"></div>
              <span>Carregando times...</span>
            </div>
          </div>

          <div id="times-lista" style="display: none">
            <div class="row g-3" id="times-grid"></div>
          </div>

          <div id="times-vazio" style="display: none">
            <div class="estado-vazio">
              <i class="bi bi-shield icone-vazio"></i>
              <p class="titulo-vazio">Nenhum time encontrado</p>
              <p class="desc-vazio">Tente buscar por outro nome.</p>
            </div>
          </div>
        </div>
      </main>

      <footer id="rodape-principal"></footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/componentes.js"></script>
    <script src="js/times.js"></script>
  </body>
</html>
