<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redefinir Senha</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="pagina-login">
      <div class="card-login">
        <div class="login-logo">
          <i class="bi bi-dribbble"></i>
          Nba Analytics
        </div>

        <div
          id="estado-token-invalido"
          style="display: none; text-align: center; padding: 16px 0"
        >
          <i
            class="bi bi-x-circle-fill"
            style="font-size: 2.5rem; color: #ff3b5c"
          ></i>
          <h2
            style="
              font-family: &quot;Oswald&quot;, sans-serif;
              font-size: 1.3rem;
              color: #1a1a2e;
              margin: 16px 0 8px;
            "
          >
            Link inválido
          </h2>
          <p style="color: #555570; font-size: 0.9rem; margin-bottom: 24px">
            O link de redefinição é inválido ou não foi informado.
          </p>
          <a
            href="login.html"
            class="btn-nba btn-nba-outline"
            style="text-decoration: none; display: inline-block"
          >
            <i class="bi bi-arrow-left me-2"></i>Voltar ao login
          </a>
        </div>

        <div id="estado-formulario" style="display: none">
          <p class="login-subtitulo">Crie uma nova senha para sua conta.</p>
          <hr class="login-divisor" />
          <div id="area-alerta"></div>
          <div class="mb-3">
            <label class="form-label-nba" for="campo-nova-senha"
              >Nova Senha</label
            >
            <input
              type="password"
              class="form-control-nba"
              id="campo-nova-senha"
              placeholder="Mínimo 6 caracteres"
            />
            <div class="mensagem-erro-campo" id="erro-nova-senha"></div>
          </div>
          <div class="mb-4">
            <label class="form-label-nba" for="campo-confirmar-senha"
              >Confirmar Nova Senha</label
            >
            <input
              type="password"
              class="form-control-nba"
              id="campo-confirmar-senha"
              placeholder="Repita a nova senha"
            />
            <div class="mensagem-erro-campo" id="erro-confirmar-senha"></div>
          </div>
          <button
            type="button"
            class="btn-nba btn-nba w-100"
            id="btn-redefinir"
            onclick="redefinirSenha()"
          >
            <i class="bi bi-lock-fill me-2"></i>Salvar nova senha
          </button>
        </div>

        <div
          id="estado-sucesso"
          style="display: none; text-align: center; padding: 16px 0"
        >
          <i
            class="bi bi-check-circle-fill"
            style="font-size: 2.5rem; color: #00a878"
          ></i>
          <h2
            style="
              font-family: &quot;Oswald&quot;, sans-serif;
              font-size: 1.3rem;
              color: #1a1a2e;
              margin: 16px 0 8px;
            "
          >
            Senha redefinida!
          </h2>
          <p style="color: #555570; font-size: 0.9rem; margin-bottom: 24px">
            Sua senha foi alterada com sucesso. Faça login com a nova senha.
          </p>
          <a
            href="login.html"
            class="btn-nba btn-nba"
            style="text-decoration: none; display: inline-block"
          >
            <i class="bi bi-box-arrow-in-right me-2"></i>Entrar na conta
          </a>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/redefinir_senha.js"></script>
  </body>
</html>
