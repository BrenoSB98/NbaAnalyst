<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
</head>

<body>
    <div id="app-wrapper">
        <nav id="navbar-principal"></nav>

        <main id="conteudo-principal">
            <div class="cabecalho-admin">
                <div class="container">
                    <div class="linha-acento mb-2"></div>
                    <div class="d-flex align-items-center gap-2 mb-1">
                        <h1 class="cabecalho-titulo mb-0">Painel Admin</h1>
                        <span class="badge-acesso-restrito"><i class="bi bi-shield-lock-fill me-1"></i>Acesso
                            Restrito</span>
                    </div>
                    <p class="cabecalho-subtitulo">
                        Histórico de relatórios de treinamento do modelo preditivo
                    </p>
                </div>
            </div>

            <div class="area-admin">
                <div class="container">
                    <div class="secao-admin">
                        <div class="secao-titulo-admin">
                            <i class="bi bi-file-earmark-pdf-fill me-2" style="color: #f75c03"></i>
                            Relatórios de Treinamento
                        </div>
                        <div id="relatorios-carregando" class="texto-carregando">
                            <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                            Carregando relatórios...
                        </div>
                        <div id="relatorios-vazio" style="display: none" class="texto-vazio">
                            Nenhum relatório gerado ainda.
                        </div>
                        <div id="relatorios-lista" style="display: none"></div>
                    </div>
                </div>
            </div>
        </main>
        <footer id="rodape-principal"></footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/componentes.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
