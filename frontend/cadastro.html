<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar Conta</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/cadastro.css" />
  </head>
  <body>
    <div class="pagina-cadastro">
      <div class="card-cadastro">
        <div class="cadastro-logo">
          <i class="bi bi-dribbble"></i>
          Nba Analytics
        </div>
        <p class="cadastro-subtitulo">Crie sua conta grátis.</p>
        <hr class="cadastro-divisor" />
        <div id="area-alerta"></div>
        <div>
          <div class="mb-3">
            <label class="form-label-nba" for="campo-nome">Nome completo</label>
            <input
              type="text"
              class="form-control-nba"
              id="campo-nome"
              placeholder="Seu nome completo"
            />
            <div class="mensagem-erro-campo" id="erro-nome"></div>
          </div>

          <div class="mb-3">
            <label class="form-label-nba" for="campo-email">E-mail</label>
            <input
              type="email"
              class="form-control-nba"
              id="campo-email"
              placeholder="seu@email.com"
            />
            <div class="mensagem-erro-campo" id="erro-email"></div>
          </div>

          <div class="mb-3">
            <label class="form-label-nba" for="campo-nascimento"
              >Data de nascimento</label
            >
            <input type="date" class="form-control-nba" id="campo-nascimento" />
            <div class="mensagem-erro-campo" id="erro-nascimento"></div>
          </div>

          <div class="mb-3">
            <label class="form-label-nba" for="campo-senha">Senha</label>
            <input
              type="password"
              class="form-control-nba"
              id="campo-senha"
              placeholder="Mínimo 6 caracteres"
            />
            <div class="mensagem-erro-campo" id="erro-senha"></div>
          </div>

          <div class="mb-4">
            <label class="form-label-nba" for="campo-confirmar-senha"
              >Confirmar senha</label
            >
            <input
              type="password"
              class="form-control-nba"
              id="campo-confirmar-senha"
              placeholder="Repita a senha"
            />
            <div class="mensagem-erro-campo" id="erro-confirmar-senha"></div>
          </div>

          <button
            type="button"
            class="btn-nba btn-nba w-100"
            id="btn-cadastrar"
            onclick="fazerCadastro()"
          >
            <i class="bi bi-person-plus me-2"></i>Criar Conta
          </button>
        </div>

        <div class="cadastro-rodape">
          Já tem conta? <a href="/login.html">Fazer login</a>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cadastro.js"></script>
  </body>
</html>
