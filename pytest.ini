[pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = backend
addopts =
    -v
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=60
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning